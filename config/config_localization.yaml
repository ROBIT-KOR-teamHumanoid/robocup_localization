/**:
  ros__parameters:
    robot_feature: "adult" # "kids" or "adult"

    topic:
      sub_topics:
        imu: "Imu"
        vision: "/vision"
        vision_feature: "/vision_feature"
        ik: "ikcoordinate"
        game_controller: "gamecontroldata"
        udp: "udp"
        task_planner: "master2local"
      
      pub_topics:
        localization: "localization"

    particle_filter:
      weight_update_threshold: 5.0
      particle_nums: 8000
      noise_enable: false
      foot_align_odom_scale: 0.65

    rate:
      ros_spin_hz: 20.0
      ui_data_hz: 20.0
      ui_render_hz: 20.0

    inference:
      mlp_enable: true          # vision_imu.onnx: 단일프레임 pose 추정
      reloc_enable: false       # clsreg.onnx: 재위치추정 후보 격자
   
      mlp_model: "model/vision_imu.onnx"
      reloc_model: "model/clsreg.onnx"
      reloc_topk: 30             # 상위 확률 셀 개수

      feature_min: 2
      sign_right: -1.0          # obs 좌표 부호
      sign_forward: 1.0
      yaw_offset_deg: 90.0      
      pan_yaw_sign: 1.0        # 카메라 pan 을 yaw 에 더할 때의 부호.
                                #   특징점 회전은 부호 확정, yaw 쪽만 실측 확인 필요

    kidnap:
      enable: true             # 먼저 로그로 관찰한 뒤 켤 것
      disagree_dist_m: 2.0      # 이만큼 벌어진 프레임만 센다.
      cluster_radius_m: 0.5     # 누적된 MLP 출력들이 모여 있어야 하는 반경
      min_frames: 15             # 판정에 필요한 최소 프레임 수
      cooldown_sec: 5.0         # 판정 후 재발동까지 대기 시간
